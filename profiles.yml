dbt_project:
  target: fabricspark-dev
  outputs:
    fabricspark-dev:
        # Connection
        type: fabricspark
        method: livy
        endpoint: https://api.fabric.microsoft.com/v1
        workspaceid: "{{ env_var('DBT_WORKSPACE_ID') }}"
        lakehouseid: "{{ env_var('DBT_LAKEHOUSE_ID') }}"
        lakehouse: MainLakehouse
        schema: dbt
        threads: 4
        authentication: CLI
        reuse_session: true
        session_idle_timeout: "30m"
        connect_retries: 1
        connect_timeout: 10
        http_timeout: 120                          # Seconds per HTTP request
        session_start_timeout: 600                 # Max wait for session start (10 min)
        statement_timeout: 3600                    # Max wait for statement result (1 hour)
        poll_wait: 10                              # Seconds between session start polls
        poll_statement_wait: 5                     # Seconds between statement result polls
        retry_all: true
        spark_config:
          name: "dbt_project"
          numExecutors: 8
          conf:
            spark.dynamicAllocation.enabled: true
            spark.dynamicAllocation.minExecutors: 8

